<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance App</title>

    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/responsive.css">
</head>
<body>
    
    <main class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <span>Finance</span>App
            </div>
            <h1>
                Selamat Datang Kembali Ke Finance App
            </h1>
            <p class="auth-description">
                Login untuk mengakses Keuangan Pribadi Kamu.
            </p>

            <from id="loginFrom" class="auth-from">
                <div class="from-group">
                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="Masukan Email Anda" required>
                </div>

                <div class="from-group">
                    <label for="password">
                        Password
                    </label>

                    <input type="password" id="password" name="password" placeholder="Masukan Password Anda" required>
                </div>

                <button type="submit" class="btn-primary full-width">
                    Login
                </button>

                <div class="auth-footer">
                    <p>Belum Punya akun?
                        <a href="register.html">
                            Daftar Sekarang
                        </a>
                    </p>

                    <a href="index.html">
                        Kembali ke home
                    </a>
                </div>
            </from>
        </div>
    </main>

    <script src="../JS/login.js"></script>
</body>
</html>
